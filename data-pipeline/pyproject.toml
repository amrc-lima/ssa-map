[project]
name = "ssa-etl"
version = "0.1.0"
description = "ETL dos dados eleitorais de Salvador 2024 para o mapa público"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pydantic>=2.6",
]

[project.scripts]
ssa-etl = "ssa_etl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
